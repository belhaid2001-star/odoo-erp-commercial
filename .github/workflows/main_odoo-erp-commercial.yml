# =============================================================================
#  CD Pipeline — Déploiement automatique sur Azure VM (Docker)
#  Déclenché à chaque push sur main → SSH sur la VM → git pull → redémarrage
# =============================================================================
name: Deploy to Azure VM — Odoo ERP Commercial

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Déploiement Azure VM
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://erp-btp-maroc.swedencentral.cloudapp.azure.com

    steps:
      - name: Checkout du code (vérification)
        uses: actions/checkout@v4

      - name: Déploiement SSH sur la VM Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            PROJECT_DIR="/opt/odoo-erp-commercial"

            echo "=== [1/4] Mise à jour du code ==="
            cd $PROJECT_DIR
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/4] Copie config production ==="
            cp deploy/odoo.prod.conf config/odoo.conf

            echo "=== [3/4] Redémarrage des conteneurs ==="
            docker compose -f deploy/docker-compose.prod.yml pull --quiet
            docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo "=== [4/4] Vérification de l'état ==="
            docker compose -f deploy/docker-compose.prod.yml ps

            echo ""
            echo "✅ Déploiement terminé — https://erp-btp-maroc.swedencentral.cloudapp.azure.com"
