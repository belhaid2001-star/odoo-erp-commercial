# =============================================================================
#  CD Pipeline — Déploiement automatique sur Azure VM (Docker)
#  Déclenché à chaque push sur main → Azure CLI → az vm run-command (pas de SSH)
# =============================================================================
name: Deploy to Azure VM — Odoo ERP Commercial

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Déploiement Azure VM
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://erp-btp-maroc.swedencentral.cloudapp.azure.com

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Déployer via az vm run-command (pas de SSH requis)
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az vm run-command invoke \
              --resource-group RG-ODOO-ERP \
              --name vm-odoo-erp \
              --command-id RunShellScript \
              --scripts '
                export HOME=/root
                set -e
                cd /opt/odoo-erp-commercial
                git remote set-url origin https://github.com/belhaid2001-star/odoo-erp-commercial.git
                git config --local credential.helper ""
                GIT_TERMINAL_PROMPT=0 git -c credential.helper="" fetch origin main
                git reset --hard origin/main
                cp deploy/odoo.prod.conf config/odoo.conf
                docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --remove-orphans
                docker compose -f deploy/docker-compose.prod.yml ps
                echo "DEPLOY_SUCCESS"
              ' \
              --query "value[0].message" -o tsv
